<title>Voutéo</title>
<style>
:root{color-scheme:light}
html,body{height:100%;margin:0}
body{background:#EFE7D6;color:#2F3B3A;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.box{max-width:360px;text-align:center;display:grid;gap:14px;justify-items:center}
.lock{width:84px;height:84px;display:grid;place-items:center;filter:drop-shadow(0 10px 18px rgba(70,55,35,.3))}.lock svg{width:84px;height:84px;display:block}
h1{font-size:20px;margin:0}
p{margin:0;color:#4A5452}
input{width:100%;box-sizing:border-box;height:42px;border-radius:10px;border:1px solid #DDD0B6;background:#FBF8F1;color:#2F3B3A;padding:0 12px;font:inherit}
button{height:42px;border:0;border-radius:10px;padding:0 18px;font:600 15px system-ui,sans-serif;color:#fff;background:#4F6B55;cursor:pointer}
.err{color:#8A4A27;min-height:1.5em}
#sp{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 30%,rgba(201,154,74,.22),transparent 65%),linear-gradient(170deg,#F4EEE2,#EFE7D6 55%,#E6DCC7);transition:opacity .45s ease}
#sp.out{opacity:0;pointer-events:none}
.sp-in{display:grid;justify-items:center;gap:6px;text-align:center}
.sp-l{position:relative;width:148px;height:148px;filter:drop-shadow(0 18px 26px rgba(70,55,35,.32))}
.sp-l svg{width:148px;height:148px;display:block}
.sp-l::after{content:"";position:absolute;left:50%;top:22%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle,rgba(233,200,120,.95),rgba(201,154,74,0) 70%);opacity:0;transform:scale(.2);animation:glow .9s ease-out .78s both}
.ks{transform-box:fill-box;transform-origin:50% 100%;animation:ksDrop 1s cubic-bezier(.45,0,.2,1) .15s both}
.arc{transform-box:fill-box;transform-origin:50% 100%;animation:arcHit .5s ease-out .68s both}
@keyframes ksDrop{0%{transform:translateY(-330px) rotate(-7deg);opacity:0}12%{opacity:1}55%{transform:translateY(0) rotate(0)}68%{transform:translateY(-22px)}80%{transform:translateY(0)}89%{transform:translateY(-6px)}100%{transform:translateY(0);opacity:1}}
@keyframes arcHit{0%{transform:scaleY(1)}30%{transform:scaleY(.955) scaleX(1.012)}65%{transform:scaleY(1.012)}100%{transform:none}}
@keyframes glow{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(5)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sp-n{margin-top:18px;font:800 40px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em;color:#2F3B3A;animation:up .6s ease-out 1s both}
.sp-n span{background:linear-gradient(90deg,#B5673B,#C99A4A);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-t{font:italic 400 16px/1.4 Georgia,serif;color:#4A5452;animation:up .6s ease-out 1.15s both}
.sp-b{margin-top:10px;font:700 10.5px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#4F6B55;animation:up .6s ease-out 1.25s both}
@media (prefers-reduced-motion:reduce){.ks,.arc,.sp-l::after,.sp-n,.sp-t,.sp-b{animation:none}}
</style>
