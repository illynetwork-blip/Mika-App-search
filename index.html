<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;color:#F0F7FF;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#051B3A}
  body{background:radial-gradient(60% 45% at 15% 10%,rgba(14,78,219,.35),transparent 60%),radial-gradient(55% 40% at 90% 90%,rgba(0,200,150,.28),transparent 60%),linear-gradient(160deg,#0E4EDB,#051B3A 55%,#041430);background-attachment:fixed}
  .lk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 12px;box-sizing:border-box}
  .lk-card{width:100%;max-width:360px;text-align:center;background:rgba(5,27,58,.62);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:28px 22px 22px;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .lk-logo{width:92px;height:92px;display:block;margin:0 auto 14px;filter:drop-shadow(0 10px 22px rgba(0,200,150,.25))}
  .lk-name{font:800 36px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em}
  .lk-name span{background:linear-gradient(90deg,#00E5FF,#00C896);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lk-by{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#7fe9ff;margin:8px 0 4px}
  .lk-tag{font-size:13px;color:#b9c3e6;margin:0 0 24px}
  form{display:flex;flex-direction:column;gap:12px}
  input[type=password],input[type=text]{font:inherit;font-size:18px;padding:14px 16px;border-radius:16px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#F0F7FF;text-align:center;letter-spacing:.2em;outline:none;transition:border-color .2s,box-shadow .2s}
  input[type=password]:focus,input[type=text]:focus{border-color:#0E4EDB;box-shadow:0 0 0 4px rgba(14,78,219,.25)}
  button{font:700 16px/1 inherit;font-family:inherit;padding:15px;border:0;border-radius:999px;background:linear-gradient(135deg,#3df0c4,#00C896 45%,#00a57c);color:#051B3A;cursor:pointer;box-shadow:0 14px 28px -12px rgba(0,200,150,.9)}
  button:disabled{opacity:.6;cursor:wait}
  label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#b9c3e6;margin-top:2px}
  input[type=text]{letter-spacing:.02em}
  .lk-hi{font-size:13px;color:#7fe9ff;margin:-10px 0 14px;min-height:1em}
  .lk-err{min-height:1.3em;font-size:14px;color:#fca5a5}
  .lk-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:#8d99c2;max-width:360px}
  .lk-foot p{margin:4px 0}
  .lk-rights{font-size:10.5px;opacity:.75}
  .lk-lang{font:12px/1 system-ui,sans-serif;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#b9c3e6;border-radius:999px;padding:7px 14px;cursor:pointer;margin:6px 0;box-shadow:none}
  .lk-lang b{color:#00C896}
  .shake{animation:sh .4s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
