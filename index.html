<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#1d2b27;color:#f3efe6;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .lk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 12px;box-sizing:border-box}
  .lk-card{width:100%;max-width:340px;text-align:center}
  .lk-logo{width:96px;height:96px;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .lk-name{font:700 34px/1 Georgia,"Times New Roman",serif;letter-spacing:.01em}
  .lk-name span{color:#e2b85a}
  .lk-by{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8fb3a3;margin:6px 0 4px}
  .lk-tag{font-size:12.5px;font-style:italic;color:#b9c8c2;margin:0 0 26px}
  form{display:flex;flex-direction:column;gap:10px}
  input[type=password]{font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;border:1.5px solid #3d5550;background:#16221f;color:#f3efe6;text-align:center;letter-spacing:.2em;outline:none}
  input[type=password]:focus{border-color:#e2b85a}
  button{font:600 16px/1 inherit;font-family:inherit;padding:14px;border:0;border-radius:12px;background:#e2b85a;color:#1d2b27;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#b9c8c2;margin-top:2px}
  .lk-err{min-height:1.3em;font-size:14px;color:#f08c7e}
  .lk-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:#9fb3ab;max-width:360px}
  .lk-foot p{margin:4px 0}
  .lk-rights{font-size:10.5px;opacity:.75}
  .lk-lang{font:12px/1 system-ui,sans-serif;background:none;border:1px solid #3d5550;color:#b9c8c2;border-radius:999px;padding:6px 12px;cursor:pointer;margin:6px 0}
  .lk-lang b{color:#e2b85a}
  .shake{animation:sh .4s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
