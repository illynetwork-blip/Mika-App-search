<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#1d2b27;color:#f3efe6;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .lk{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 12px;box-sizing:border-box}
  .lk-card{width:100%;max-width:340px;text-align:center}
  .lk-logo{width:96px;height:96px;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  .lk-name{font:700 34px/1 Georgia,"Times New Roman",serif;letter-spacing:.01em}
  .lk-name span{color:#e2b85a}
  .lk-by{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8fb3a3;margin:6px 0 4px}
  .lk-tag{font-size:12.5px;font-style:italic;color:#b9c8c2;margin:0 0 26px}
  form{display:flex;flex-direction:column;gap:10px}
  input[type=password]{font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;border:1.5px solid #3d5550;background:#16221f;color:#f3efe6;text-align:center;letter-spacing:.2em;outline:none}
  input[type=password]:focus{border-color:#e2b85a}
  button{font:600 16px/1 inherit;font-family:inherit;padding:14px;border:0;border-radius:12px;background:#e2b85a;color:#1d2b27;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#b9c8c2;margin-top:2px}
  .lk-err{min-height:1.3em;font-size:14px;color:#f08c7e}
  .lk-foot{margin-top:auto;padding-top:28px;text-align:center;font-size:11.5px;color:#9fb3ab;max-width:360px}
  .lk-foot p{margin:4px 0}
  .lk-rights{font-size:10.5px;opacity:.75}
  .lk-lang{font:12px/1 system-ui,sans-serif;background:none;border:1px solid #3d5550;color:#b9c8c2;border-radius:999px;padding:6px 12px;cursor:pointer;margin:6px 0}
  .lk-lang b{color:#e2b85a}
  .shake{animation:sh .4s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

  $("lkLang").onclick=function(){ lang = lang==="fr" ? "en" : "fr"; try{ localStorage.setItem("zz.lang",lang); }catch(e){} applyLang(); };
  applyLang();
  if(!window.crypto||!crypto.subtle){ $("lkErr").textContent="Ce navigateur est trop ancien pour ouvrir Zoom-Zoom (il faut une page en https)."; $("lkBtn").disabled=true; return; }
  function inflate(buf){
    if(window.DecompressionStream){ return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
    return new Promise(function(res,rej){ var s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js";
      s.onload=function(){ try{ res(new TextDecoder().decode(pako.inflate(new Uint8Array(buf)))); }catch(e){ rej(e); } }; s.onerror=rej; document.head.appendChild(s); });
  }
  function open(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct).then(inflate).then(function(html){ return {html:html,key:key}; });
  }
  function show(r){ document.open(); document.write(r.html); document.close(); }
  function keyFromPw(pw){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"]); });
  }
  // clé mémorisée (option « rester connecté »)
  try{ var m=JSON.parse(localStorage.getItem(KEY)||"null");
    if(m && m.exp>Date.now() && m.salt===btoa(String.fromCharCode.apply(null,salt))){
      crypto.subtle.importKey("raw",b64(m.k),"AES-GCM",true,["decrypt"]).then(open).then(show).catch(function(){ localStorage.removeItem(KEY); });
    } }catch(e){}
  var fails=0, wait=0;
  $("lkForm").addEventListener("submit",function(ev){
    ev.preventDefault(); if(Date.now()<wait) return;
    var btn=$("lkBtn"), err=$("lkErr"); btn.disabled=true; btn.textContent=T[lang].open; err.textContent="";
    keyFromPw($("lkPw").value).then(open).then(function(r){
      if($("lkKeep").checked){ return crypto.subtle.exportKey("raw",r.key).then(function(k){
        try{ localStorage.setItem(KEY,JSON.stringify({k:btoa(String.fromCharCode.apply(null,new Uint8Array(k))),salt:btoa(String.fromCharCode.apply(null,salt)),exp:Date.now()+30*864e5})); }catch(e){}
        show(r); }); }
      try{ localStorage.removeItem(KEY); }catch(e){}
      show(r);
    }).catch(function(){
      fails++; var d = fails>=3 ? Math.min(30,(fails-2)*5) : 0; wait=Date.now()+d*1000;
      err.textContent = d ? T[lang].bad+" "+T[lang].wait+d+" s." : T[lang].bad;
      var c=document.querySelector(".lk-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
      $("lkPw").select(); btn.disabled=false; btn.textContent=T[lang].go;
    });
  });
})();
</script>
